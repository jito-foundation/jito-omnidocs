name: Validate Documentation Structure

# PRs are validated here; master is validated by vercel-deploy.yml, which calls this
# workflow before deploying.
on:
  pull_request:
    branches: ['**']
  workflow_call:

permissions:
  contents: read

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        
      - name: Validate v2 content (tools/build-manifest.mjs)
        run: node tools/build-manifest.mjs --check

      - name: Test docs tooling
        run: node --test tools/test/*.test.mjs
