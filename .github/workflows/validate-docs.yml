name: Validate Documentation Structure

on:
  push:
    # master is validated by vercel-deploy.yml, which calls this workflow before deploying.
    branches-ignore: [master]
  pull_request:
    branches: ['**']
  workflow_call:

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        
      - name: Validate v2 content (tools/build-manifest.mjs)
        run: node tools/build-manifest.mjs --check

      - name: Test docs tooling
        run: node --test tools/test/*.test.mjs

      - name: Run critical documentation validation
        run: node validate-docs-structure.js --only-critical
        
      - name: Run full documentation validation
        run: node validate-docs-structure.js
        continue-on-error: true
        
      - name: Comment on PR with validation results
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Documentation structure validation failed. Please check the logs and fix the issues before merging.'
            }) 